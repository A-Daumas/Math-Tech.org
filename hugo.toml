baseurl = "https://math-tech.org"
languageCode = "en-us"
theme = "terminal"
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.en]
    title = "Math-Tech.org"
    copyright = "Alexander Daumas | © 2026"
    [languages.en.params]
      subtitle = "A simple, retro theme for Hugo"
      keywords = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.en.params.logo]
        logoText = "Math-Tech.org"
        logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
      [[languages.en.menu.main]]
        identifier = "content"
        name = "Content"
        url = "/content/"
      [[languages.en.menu.main]]
        identifier = "Bio"
        name = "Bio"
        url = "/me"

